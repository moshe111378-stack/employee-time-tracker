name: Assignment and live-sync checks
on:
  push:
    branches: [codex/assignment-sync-back-navigation-20261015]
  pull_request:
    branches: [main]
    paths: ['app.py', 'assignment_sync.py', 'manual_hours.py', 'period_reports.py', 'event_dates.py', 'templates/**', 'static/*sync.js', 'static/attendance-time.*', 'tests/**', '.github/workflows/assignment-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assignment-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements.txt pytest==8.4.2
          npm install --prefix "$RUNNER_TEMP/sync-dom" jsdom@26.1.0 --no-audit --no-fund
      - name: Assignment persistence and navigation
        run: python -m pytest tests -q
      - name: Browser-state and form preservation
        env:
          NODE_PATH: ${{ runner.temp }}/sync-dom/node_modules
          SYNC_FIXTURES: ${{ runner.temp }}/sync-fixtures
        run: |
          python tests/render_sync_fixtures.py "$SYNC_FIXTURES"
          node tests/worker_sync.test.cjs
          node tests/period_reports.test.cjs
          node tests/attendance_time.test.cjs
          node tests/attendance_edit.test.cjs
          node --check static/attendance-time.js
          node --check static/worker-sync.js
          node --check static/event-sync.js
