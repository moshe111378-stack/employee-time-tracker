name: Attendance regression checks
on:
  pull_request:
    paths:
      - 'app.py'
      - 'attendance_admin.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/attendance-checks.yml'
permissions:
  contents: read
jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Test edits, permissions, audit compatibility, totals and export
        run: python -m pytest -q tests/ --junitxml=test-results/attendance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-test-results
          path: test-results/attendance.xml
          if-no-files-found: ignore
