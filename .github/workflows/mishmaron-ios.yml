name: Mishmaron iOS verification
on:
  push:
    branches: [mishmaron-ios-preparation]
    paths: ['ios/**', '.github/workflows/mishmaron-ios.yml']
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Sign and upload to App Store Connect after verification (no App Review submission)'
        type: boolean
        default: false
      build_number:
        description: 'Unused build number for version 1.2.0 (check App Store Connect first)'
        type: string
        default: '9'
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify App Store SDK requirement
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build device archive without signing
        run: |
          xcodebuild -project ios/Mishmaron.xcodeproj -scheme Mishmaron -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Mishmaron.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Run iPhone simulator checks
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/Mishmaron.xcodeproj -scheme Mishmaron -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath "$RUNNER_TEMP/Mishmaron.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Preserve archive and test screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Mishmaron.xcarchive" ]; then ditto -c -k --keepParent "$RUNNER_TEMP/Mishmaron.xcarchive" "$RUNNER_TEMP/Mishmaron-unsigned.xcarchive.zip"; fi
          if [ -d "$RUNNER_TEMP/Mishmaron.xcresult" ]; then xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Mishmaron.xcresult" --output-path "$RUNNER_TEMP/screenshots"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mishmaron-ios-verification
          path: |
            ${{ runner.temp }}/Mishmaron-unsigned.xcarchive.zip
            ${{ runner.temp }}/Mishmaron.xcresult
            ${{ runner.temp }}/screenshots
          retention-days: 14
  testflight:
    needs: verify
    # An explicit upload-request commit changing ios/testflight-request.txt
    # can start this branch-only workflow without merging iOS code into main.
    if: github.ref == 'refs/heads/mishmaron-ios-preparation' && ((github.event_name == 'workflow_dispatch' && inputs.upload_testflight) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'TestFlight: upload build ')))
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: mishmaron-testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Sign, verify and upload build
        env:
          MISHMARON_TEAM_ID: ${{ secrets.MISHMARON_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          MISHMARON_BUILD_NUMBER: ${{ inputs.build_number }}
          MISHMARON_UPLOAD_REQUEST: ${{ github.event.head_commit.message }}
        run: bash ios/scripts/upload-testflight.sh
      - name: Preserve signed IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mishmaron-ios-signed-${{ github.run_id }}
          path: ios/build/testflight/export/*.ipa
          if-no-files-found: error
          retention-days: 14
