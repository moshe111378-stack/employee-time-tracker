name: Mishmaron iOS verification
on:
  push:
    branches: [mishmaron-ios-preparation]
    paths: ['ios/**', '.github/workflows/mishmaron-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify App Store SDK requirement
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build device archive without signing
        run: |
          xcodebuild -project ios/Mishmaron.xcodeproj -scheme Mishmaron -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Mishmaron.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Run iPhone simulator checks
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/Mishmaron.xcodeproj -scheme Mishmaron -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath "$RUNNER_TEMP/Mishmaron.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Preserve archive and test screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Mishmaron.xcarchive" ]; then ditto -c -k --keepParent "$RUNNER_TEMP/Mishmaron.xcarchive" "$RUNNER_TEMP/Mishmaron-unsigned.xcarchive.zip"; fi
          if [ -d "$RUNNER_TEMP/Mishmaron.xcresult" ]; then xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Mishmaron.xcresult" --output-path "$RUNNER_TEMP/screenshots"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mishmaron-ios-verification
          path: |
            ${{ runner.temp }}/Mishmaron-unsigned.xcarchive.zip
            ${{ runner.temp }}/Mishmaron.xcresult
            ${{ runner.temp }}/screenshots
          retention-days: 14
