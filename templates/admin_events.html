{% extends 'base.html' %}{% block c %}<a class="screen-back" href="/admin">←</a><h1>📅 אירועים</h1><section class="panel"><form action="/admin/add-event" method="post"><input name="name" placeholder="שם האירוע" required><input type="date" name="date"><button>הוסף אירוע</button></form>{% for e in events %}<div class="item"><form class="row" action="/admin/event/{{e.id}}/edit" method="post"><input name="name" value="{{e.name}}" required><input type="date" name="date" value="{{e.date or ''}}"><button>שמור אירוע</button></form><a href="/admin/event/{{e.id}}">דוחות ושיוך עובדים ←</a><form action="/admin/event/{{e.id}}/delete" method="post" onsubmit="return prettyConfirm(event,'האם למחוק את האירוע הזה?')"><button class="out">מחק אירוע</button></form></div>{% endfor %}</section>{% endblock %}
