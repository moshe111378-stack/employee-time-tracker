{% extends 'base.html' %}{% block c %}<h1>📅 אירועים</h1><section class="panel"><form action="/admin/add-event" method="post"><input type="hidden" name="csrf" value="{{event_dates_csrf}}"><input name="name" placeholder="שם האירוע" required><div class="pair"><label>תאריך התחלה<input type="date" name="date" required></label><label>תאריך סיום<input type="date" name="end_date" required></label></div><p class="muted">אפשר לבחור אירוע של יום אחד, כמה ימים או תקופה של שנה ויותר.</p><h3>👥 שיוך עובדים לאירוע</h3><p class="muted">בחר עד 50 עובדים שיצורפו לאירוע מיד עם יצירתו.</p><div class="create-worker-list">{% for w in workers %}<label class="item"><input type="checkbox" name="worker_ids" value="{{w.id}}"> {{w.name}}</label>{% endfor %}</div><button>צור אירוע ושמור שיוכים</button></form>{% for e in events %}<div class="item"><form class="row" action="/admin/event/{{e.id}}/edit" method="post"><input type="hidden" name="csrf" value="{{event_dates_csrf}}"><input name="name" value="{{e.name}}" required><label>תאריך התחלה<input type="date" name="date" value="{{e.date or ''}}" required></label><label>תאריך סיום<input type="date" name="end_date" value="{{e.end_date or e.date or ''}}" required></label><button>שמור אירוע</button></form><a href="/admin/event/{{e.id}}">👥 עריכת שיוכים · דוחות ושעות ←</a><form action="/admin/event/{{e.id}}/delete" method="post" onsubmit="return prettyConfirm(event,'האם למחוק את האירוע הזה?')"><button class="out">מחק אירוע</button></form></div>{% endfor %}</section>{% endblock %}
