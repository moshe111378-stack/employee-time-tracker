{% extends 'base.html' %}{% block c %}<a class="screen-back" href="/admin">←</a><h1>📅 אירועים</h1><section class="panel"><form action="/admin/add-event" method="post"><input name="name" placeholder="שם האירוע" required><input type="date" name="date"><h3>👥 שיוך עובדים לאירוע</h3><p class="muted">בחר עד 50 עובדים שיצורפו לאירוע מיד עם יצירתו.</p><div class="create-worker-list">{% for w in workers %}<label class="item"><input type="checkbox" name="worker_ids" value="{{w.id}}"> {{w.name}}</label>{% endfor %}</div><button>צור אירוע ושמור שיוכים</button></form>{% for e in events %}<div class="item"><form class="row" action="/admin/event/{{e.id}}/edit" method="post"><input name="name" value="{{e.name}}" required><input type="date" name="date" value="{{e.date or ''}}"><button>שמור אירוע</button></form><a href="/admin/event/{{e.id}}">📊 דוחות ועריכת שעות ←</a><form action="/admin/event/{{e.id}}/delete" method="post" onsubmit="return prettyConfirm(event,'האם למחוק את האירוע הזה?')"><button class="out">מחק אירוע</button></form></div>{% endfor %}</section>{% endblock %}
