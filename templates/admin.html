{% extends 'base.html' %}{% block c %}<h1>ממשק מנהלים</h1><div class="stats"><div><b>{{events|length}}</b><span>אירועים / 20</span></div><div><b>{{workers|length}}</b><span>עובדים</span></div><div><b>{{admins|length}}</b><span>מנהלים / 10</span></div></div><div class="cols"><section class="panel"><h2>אירועים</h2><form action="/admin/add-event" method="post"><input name="name" placeholder="שם האירוע" required><input type="date" name="date"><button>הוסף אירוע</button></form>{% for e in events %}<a class="item" href="/admin/event/{{e.id}}"><b>{{e.name}}</b><span>פתח ניהול ←</span></a>{% endfor %}</section><section class="panel"><h2>עובדים</h2><form action="/admin/add-worker" method="post"><input name="name" placeholder="שם עובד" required><input name="phone" placeholder="טלפון"><button>הוסף עובד</button></form>{% for w in workers %}<div class="item"><form class="row" action="/admin/worker/{{w.id}}/edit" method="post"><input name="name" value="{{w.name}}" required><input name="phone" value="{{w.phone or ''}}" placeholder="טלפון"><button>שמור</button></form><form action="/admin/worker/{{w.id}}/delete" method="post"><button class="out">מחק עובד</button></form></div>{% endfor %}</section></div><section class="panel"><h2>מנהלים</h2><form class="row" action="/admin/add-admin" method="post"><input name="name" placeholder="שם"><input name="user" placeholder="שם משתמש"><input type="password" name="pw" placeholder="סיסמה"><button>הוסף מנהל</button></form></section>{% endblock %}
