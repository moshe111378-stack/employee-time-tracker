<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אבטחה זיבלד | שעון עבודה</title><link rel="stylesheet" href="/static/style.css"><meta name="theme-color" content="#071426"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/static/manifest.webmanifest"></head><body><header><div class="logo">🛡️ ZIBALD SECURITY · שעון עבודה</div></header><main>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block c %}{% endblock %}</main><div id="confirmOverlay" class="confirm-overlay"><div class="confirm-box"><div class="confirm-icon">🗑️</div><h2>אישור מחיקה</h2><p id="confirmText"></p><div class="confirm-actions"><button type="button" class="gray" onclick="closePrettyConfirm()">ביטול</button><button type="button" class="out" id="confirmDelete">כן, למחוק</button></div></div></div><script>let pendingDeleteForm=null;function prettyConfirm(e,msg){e.preventDefault();pendingDeleteForm=e.target;document.getElementById('confirmText').textContent=msg;document.getElementById('confirmOverlay').classList.add('open');return false}function closePrettyConfirm(){document.getElementById('confirmOverlay').classList.remove('open');pendingDeleteForm=null}document.getElementById('confirmDelete').onclick=function(){if(pendingDeleteForm){const f=pendingDeleteForm;pendingDeleteForm=null;document.getElementById('confirmOverlay').classList.remove('open');f.submit()}}</script>{% block scripts %}{% endblock %}<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/static/sw.js'))}</script><footer style="text-align:center;padding:14px 8px 10px;font-size:13px;color:#777">נוצר על ידי איתי משה וולינר · 055556-3091</footer>
</body></html>
