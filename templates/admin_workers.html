{% extends 'base.html' %}{% block c %}<a class="screen-back" href="/admin">←</a><h1>👥 עובדים</h1><section class="panel"><input id="workerSearch" class="worker-search" placeholder="🔎 חיפוש עובד..." oninput="filterWorkers(this.value)"><form action="/admin/add-worker" method="post"><input name="name" placeholder="שם עובד" required><input name="phone" placeholder="טלפון"><button>הוסף עובד</button></form>{% for w in workers %}<div class="item worker-item" data-name="{{w.name|lower}}"><form class="row" action="/admin/worker/{{w.id}}/edit" method="post"><input name="name" value="{{w.name}}" required><input name="phone" value="{{w.phone or ''}}" placeholder="טלפון"><label class="rate-edit">💰 עריכת תשלום שעתי<input name="hourly_rate" type="number" step="0.01" min="0" value="{{w.hourly_rate or ''}}" placeholder="שכר לשעה"></label><button>שמור</button></form><form action="/admin/worker/{{w.id}}/delete" method="post" onsubmit="return prettyConfirm(event,'האם למחוק את העובד הזה?')"><button class="out">מחק עובד</button></form></div>{% endfor %}</section><script>function filterWorkers(value){const q=(value||'').trim().toLowerCase();document.querySelectorAll('.worker-item').forEach(x=>x.hidden=!!q&&!(x.dataset.name||'').toLowerCase().includes(q))}</script>{% endblock %}
