{% extends 'base.html' %}{% block c %}<h1>{{event.name}}</h1><form class="panel" method="post" enctype="multipart/form-data"><label>עובד<select name="wid" required><option value="">בחר עובד</option>{% for w in workers %}<option value="{{w.id}}">{{w.name}}</option>{% endfor %}</select></label><label>תמונה (אופציונלי)<input type="file" name="photo" accept="image/*" capture="environment"></label><input type="hidden" name="lat" id="lat"><input type="hidden" name="lon" id="lon"><input type="hidden" name="acc" id="acc"><div id="gps" class="item">📍 המיקום הנוכחי ייקלט בעת הדיווח</div><div class="actions"><button class="in" name="act" value="in">כניסה</button><button class="out" name="act" value="out">יציאה</button></div></form><script>document.querySelector('form').addEventListener('submit',function(e){if(this.dataset.gps)return; e.preventDefault();let f=this;if(!navigator.geolocation){document.getElementById('gps').textContent='❌ אין תמיכה במיקום';return}document.getElementById('gps').textContent='📍 קולט מיקום נוכחי...';navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lon.value=p.coords.longitude;acc.value=Math.round(p.coords.accuracy);f.dataset.gps='1';f.requestSubmit(e.submitter)},()=>{document.getElementById('gps').textContent='❌ יש לאשר הרשאת מיקום כדי לדווח'},{enableHighAccuracy:true,maximumAge:0,timeout:10000})})</script>{% endblock %}
