{% extends 'base.html' %}{% block c %}<h1>{{event.name}}</h1><p class="muted">בחר את השם שלך. המיקום נלקח רק מהמיקום הנוכחי של הטלפון בזמן הדיווח.</p><form class="card" id="punch" method="post" enctype="multipart/form-data"><label>שם העובד<select name="wid" required><option value="">בחר עובד</option>{% for w in workers %}<option value="{{w.id}}">{{w.name}}</option>{% endfor %}</select></label><label>📷 תמונה<input type="file" name="photo" accept="image/*" capture="environment"></label><input type="hidden" name="lat" id="lat"><input type="hidden" name="lon" id="lon"><input type="hidden" name="acc" id="acc"><div id="gps" class="gps">📍 המיקום הנוכחי ייקלט אוטומטית בעת הדיווח</div><div class="actions"><button class="in" name="act" value="in">כניסה</button><button class="out" name="act" value="out">יציאה</button></div></form><script>document.getElementById('punch').addEventListener('submit',function(e){if(this.dataset.gps)return;e.preventDefault();const f=this,b=e.submitter,g=document.getElementById('gps');g.textContent='📍 קולט מיקום נוכחי...';if(!navigator.geolocation){g.textContent='❌ אין תמיכה במיקום';return}navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lon.value=p.coords.longitude;acc.value=Math.round(p.coords.accuracy);g.textContent='✅ המיקום הנוכחי נקלט';f.dataset.gps='1';f.requestSubmit(b)},()=>g.textContent='❌ יש לאשר הרשאת מיקום כדי לדווח',{enableHighAccuracy:true,maximumAge:0,timeout:10000})})</script>{% endblock %}
