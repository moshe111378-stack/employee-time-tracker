{% extends 'base.html' %}{% block c %}
<div class="brand-mini"><b>🛡️ ZIBALD SECURITY</b><span>אבטחה זיבלד · אנשים. ביטחון. בכל אירוע.</span></div><h1>דיווח נוכחות</h1><p class="muted">בחר את השם שלך. יוצגו רק האירועים שאליהם המנהל שייך אותך.</p>
<div class="card">
<label>👤 שם העובד<select id="workerSel"><option value="">בחר את השם שלך</option></select></label>
<div id="eventWrap" style="display:none"><label>📅 האירוע שלך<select id="eventSel"></select></label></div>
<div id="eventBox" class="gps"><b>📅 האירוע שלך</b><br><span>בחר את השם שלך.</span></div>
<label>📷 תמונה<input id="photo" type="file" accept="image/*" capture="environment" required></label>
<div id="gps" class="gps"><b>📍 מיקום נוכחי</b><br><span>ייקלט אוטומטית בזמן הדיווח. העובד אינו יכול לבחור או לשנות מיקום.</span></div>
<div class="actions"><button class="in" onclick="sendPunch('in')">🟢 כניסה</button><button class="out" onclick="sendPunch('out')">🔴 יציאה</button></div>
</div>
<script>
const assignments=[{% for a in assignments %}{wid:'{{a.worker_id}}',eid:'{{a.event_id}}',event:{{a.event_name|tojson}}}{% if not loop.last %},{% endif %}{% endfor %}];
const ws=document.getElementById('workerSel'),es=document.getElementById('eventSel'),wrap=document.getElementById('eventWrap'),box=document.getElementById('eventBox'),gps=document.getElementById('gps'),photo=document.getElementById('photo');
{% for w in workers %}ws.add(new Option({{w.name|tojson}},'{{w.id}}'));{% endfor %}
function renderEvent(){const o=es.options[es.selectedIndex];if(o&&o.value)box.innerHTML='<b>✅ אירוע נבחר</b><br>'+o.text}
ws.onchange=()=>{es.innerHTML='';const a=assignments.filter(x=>x.wid===ws.value);if(!a.length){wrap.style.display='none';box.innerHTML='<b>❌ העובד לא משויך לאירוע</b>';return}a.forEach(x=>es.add(new Option(x.event,x.eid)));wrap.style.display=a.length>1?'block':'none';es.selectedIndex=0;renderEvent()};es.onchange=renderEvent;
function sendPunch(a){if(!ws.value||!es.value){gps.innerHTML='<b>❌ בחר שם ואירוע</b>';return}if(!photo.files.length){gps.innerHTML='<b>❌ יש לצלם תמונה לפני הדיווח</b>';return}if(!navigator.geolocation){gps.innerHTML='<b>❌ אין תמיכה במיקום</b>';return}gps.innerHTML='<b>📍 קולט מיקום נוכחי...</b>';navigator.geolocation.getCurrentPosition(pos=>{const fd=new FormData();fd.append('wid',ws.value);fd.append('act',a);fd.append('lat',pos.coords.latitude);fd.append('lon',pos.coords.longitude);fd.append('acc',Math.round(pos.coords.accuracy));fd.append('photo',photo.files[0]);fetch('/event/'+es.value,{method:'POST',body:fd,redirect:'follow'}).then(r=>{if(!r.ok)throw 0;const msg=a==='in'?'✓ הכניסה נרשמה בהצלחה':'✓ היציאה נרשמה בהצלחה';alert(msg+'\nהתמונה והמיקום נשמרו.');location.href='/'}).catch(()=>gps.innerHTML='<b>❌ הדיווח לא נשלח</b>')},()=>gps.innerHTML='<b>❌ יש לאשר גישה למיקום הנוכחי</b>',{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
</script>{% endblock %}
